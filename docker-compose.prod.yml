services:
  backend:
    image: sustainability-backend:latest
    restart: unless-stopped
    environment:
      RUST_LOG: "info,hyper=info,sea_orm=info"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}"
      KEYCLOAK_URL: "${KEYCLOAK_URL:-https://localhost/keycloak}"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://localhost}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  migrate:
    image: sustainability-backend:latest
    restart: "no"
    command: ["/app/db-migrator"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: sustainability-frontend:latest
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - openapi-volume:/openapi
    entrypoint: >
      /bin/sh -c "
        : $${SERVER_NAME:=_};
        envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf;
        while [ ! -f /openapi/openapi.json ]; do
          echo 'Waiting for openapi.json...';
          sleep 2;
        done;
        cp /openapi/openapi.json /usr/share/nginx/html/openapi.json;
        nginx -g 'daemon off;'
      "

  keycloak:
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          bash -lc 'exec 3<>/dev/tcp/localhost/8080 &&
          printf "GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q "200" || (
            exec 3<>/dev/tcp/localhost/8080 &&
            printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
            head -n 1 <&3 | grep -q "200"
          )'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openapi-volume:
    external: false

networks:
  tool-net:
    driver: bridge
