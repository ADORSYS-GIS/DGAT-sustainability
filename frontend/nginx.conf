upstream keycloak_server {
    server keycloak:8080;
}

upstream backend_server {
    server backend:3001;
}

# HTTP only — SSL is terminated by host Nginx
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    add_header Access-Control-Allow-Origin '*' always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /callback {
        try_files $uri $uri/ /index.html;
    }

    location /keycloak/ {
        proxy_pass http://keycloak_server/keycloak/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_ssl_verify off;
        proxy_redirect http://keycloak_server/keycloak/ https://$host/keycloak/;
        proxy_redirect http://keycloak:8080/keycloak/ https://$host/keycloak/;
    }

    location /api/ {
        proxy_pass http://backend_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
